name: Byg Plytix lager-import
 
on:
  schedule:
    - cron: '0 5 * * *'      # dagligt 05:00 UTC (07:00 dansk sommertid) - efter Matrixify
  workflow_dispatch: {}
 
jobs:
  byg-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install paramiko
      - name: Byg import-fil og laeg paa boksen
        env:
          PLX_KEY: ${{ secrets.PLX_KEY }}
          PLX_PWD: ${{ secrets.PLX_PWD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_FILE: ${{ secrets.SFTP_FILE }}
          UPLOAD_PATH: '/Plytix-import/plytix_lager.csv'
          FJERNLAGER_FIELD: 'fjernlager_antal'
          EXCLUDE_LOCATIONS: 'Business Central,Fjernlager'
        run: python opdater_lager.py
